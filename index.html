<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Code 128 (Mod 10) 第 20 碼驗證碼與條碼產生器</title>
    <!-- 引入 JsBarcode 函式庫 -->
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    <style>
        :root {
            --primary-color: #2b5c8f;
            --primary-hover: #1d4066;
            --bg-color: #f4f7f9;
            --card-bg: #ffffff;
            --text-color: #333333;
            --border-color: #dcdfe6;
            --success-color: #2e7d32;
            --error-color: #c62828;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 580px;
        }

        h1 {
            font-size: 22px;
            color: var(--primary-color);
            margin-bottom: 20px;
            text-align: center;
            border-bottom: 2px solid #eef2f5;
            padding-bottom: 12px;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            font-size: 14px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #555;
        }

        .input-wrapper {
            position: relative;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px 16px;
            font-size: 18px;
            letter-spacing: 2px;
            font-family: monospace;
            border: 2px solid var(--border-color);
            border-radius: 6px;
            outline: none;
            transition: border-color 0.2s;
        }

        input[type="text"]:focus {
            border-color: var(--primary-color);
        }

        .char-count {
            position: absolute;
            right: 12px;
            top: 50%;
            transform: translateY(-50%);
            font-size: 12px;
            color: #888;
            font-family: sans-serif;
        }

        button {
            width: 100%;
            padding: 12px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: var(--primary-hover);
        }

        .result-box {
            margin-top: 25px;
            padding: 20px;
            background-color: #f8fafc;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            display: none;
        }

        .result-box.active {
            display: block;
        }

        .result-item {
            margin-bottom: 15px;
        }

        .result-label {
            font-size: 13px;
            color: #666;
            margin-bottom: 4px;
        }

        .result-value {
            font-family: monospace;
            font-size: 20px;
            font-weight: bold;
            color: var(--primary-color);
            letter-spacing: 2px;
            word-break: break-all;
        }

        .check-digit {
            color: var(--success-color);
            font-size: 26px;
        }

        .barcode-container {
            margin-top: 15px;
            padding: 15px;
            background-color: #ffffff;
            border: 1px solid #cbd5e0;
            border-radius: 6px;
            text-align: center;
        }

        #barcode {
            max-width: 100%;
            height: auto;
        }

        .error-msg {
            color: var(--error-color);
            font-size: 14px;
            margin-top: 8px;
            display: none;
        }

        .info-card {
            margin-top: 20px;
            padding: 12px 15px;
            background-color: #edf2f7;
            border-left: 4px solid var(--primary-color);
            border-radius: 4px;
            font-size: 13px;
            color: #4a5568;
            line-height: 1.5;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Code 128 第20碼驗證碼與條碼產生器</h1>

    <div class="form-group">
        <label for="barcode19">請輸入前 19 碼數字：</label>
        <div class="input-wrapper">
            <input type="text" id="barcode19" maxlength="19" placeholder="請輸入 19 位數" autocomplete="off">
            <span class="char-count" id="charCount">0/19</span>
        </div>
        <div class="error-msg" id="errorMsg">請輸入剛好 19 位數字！</div>
    </div>

    <button id="calcBtn">自動計算第 20 碼並繪製條碼</button>

    <div class="result-box" id="resultBox">
        <div class="result-item">
            <div class="result-label">第 20 碼驗證碼 (Mod 10)：</div>
            <div class="result-value check-digit" id="checkDigitVal">-</div>
        </div>
        <hr style="border: none; border-top: 1px dashed #cbd5e0; margin: 12px 0;">
        <div class="result-item">
            <div class="result-label">完整 20 碼內容：</div>
            <div class="result-value" id="fullBarcodeVal">-</div>
        </div>
        
        <div class="barcode-container">
            <div class="result-label" style="margin-bottom: 8px;">Code 128 條碼預覽：</div>
            <svg id="barcode"></svg>
        </div>
    </div>

    <div class="info-card">
        <strong>說明：</strong> 本工具採用標準 Modulus 10 演算法計算第 20 位檢查碼，並即時以 Code 128 格式繪製可掃描之條碼影像。
    </div>
</div>

<script>
    const inputEl = document.getElementById('barcode19');
    const charCountEl = document.getElementById('charCount');
    const errorMsgEl = document.getElementById('errorMsg');
    const resultBoxEl = document.getElementById('resultBox');
    const checkDigitValEl = document.getElementById('checkDigitVal');
    const fullBarcodeValEl = document.getElementById('fullBarcodeVal');
    const calcBtn = document.getElementById('calcBtn');

    inputEl.addEventListener('input', function() {
        // 只允許輸入數字
        this.value = this.value.replace(/\D/g, '');
        const len = this.value.length;
        charCountEl.textContent = `${len}/19`;

        if (len === 19) {
            errorMsgEl.style.display = 'none';
            calculateAndRender();
        } else {
            resultBoxEl.classList.remove('active');
        }
    });

    calcBtn.addEventListener('click', function() {
        if (inputEl.value.length !== 19) {
            errorMsgEl.style.display = 'block';
            resultBoxEl.classList.remove('active');
        } else {
            errorMsgEl.style.display = 'none';
            calculateAndRender();
        }
    });

    function calculateMod10(digit19) {
        let sum = 0;
        // 由右至左計算加權 (奇數位*3, 偶數位*1)
        for (let i = 0; i < 19; i++) {
            let num = parseInt(digit19.charAt(18 - i), 10);
            let weight = (i % 2 === 0) ? 3 : 1;
            sum += num * weight;
        }
        let remainder = sum % 10;
        let checkDigit = (10 - remainder) % 10;
        return checkDigit;
    }

    function calculateAndRender() {
        const input = inputEl.value.trim();
        if (input.length !== 19) return;

        const checkDigit = calculateMod10(input);
        const fullBarcode = input + checkDigit;

        checkDigitValEl.textContent = checkDigit;
        fullBarcodeValEl.textContent = fullBarcode;
        resultBoxEl.classList.add('active');

        // 使用 JsBarcode 繪製 Code 128 條碼
        JsBarcode("#barcode", fullBarcode, {
            format: "CODE128",
            lineColor: "#000",
            width: 2,
            height: 70,
            displayValue: true,
            fontSize: 16,
            margin: 10
        });
    }
</script>

</body>
</html>
